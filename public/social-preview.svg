  <rect x="70" y="62" width="1060" height="506" rx="44" fill="#101824" opacity="0.78" stroke="#ffffff" stroke-opacity="0.12"/>

  <rect x="104" y="96" width="78" height="78" rx="22" fill="url(#gold)"/>
  <path d="M132 120h18c18 0 31 12 31 30s-13 30-31 30h-18v-60Zm18 42c7.5 0 12.5-4.7 12.5-12s-5-12-12.5-12h-3v24h3Z" fill="#07111c"/>

