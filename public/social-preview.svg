  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.52" stop-color="#08111d"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
